# One Render web service: FastAPI serves both the JSON API and the built React app.
services:
  - type: web
    name: acme-salary-management
    runtime: python
    plan: free
    buildCommand: >-
      pip install uv &&
      cd frontend && npm ci && npm run build &&
      cd ../backend && uv sync --frozen --no-dev
    # Seeding is skipped automatically when employees already exist.
    startCommand: >-
      cd backend &&
      uv run --no-dev python -m scripts.seed &&
      uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: NODE_VERSION
        value: "22"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:///./salary_management.db
